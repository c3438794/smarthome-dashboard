<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smarthome 智能家居控制面板</title>
<style>
  :root{
    --bg:#0f1419; --card:#1a2028; --card2:#212a34; --text:#e8edf2;
    --sub:#8a97a5; --accent:#3da5ff; --on:#ffb020; --ok:#38c976;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  h1{font-size:22px;font-weight:600}
  h1 span{color:var(--accent)}
  .status{font-size:13px;color:var(--ok)}
  .rooms{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .room-btn{background:var(--card);border:1px solid #2a3542;color:var(--sub);padding:8px 18px;border-radius:20px;cursor:pointer;font-size:14px;transition:.2s}
  .room-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:20px;transition:.2s}
  .card:hover{background:var(--card2)}
  .card .icon{font-size:30px;margin-bottom:12px}
  .card h3{font-size:16px;margin-bottom:4px;font-weight:500}
  .card .desc{font-size:13px;color:var(--sub)}
  .toggle{margin-top:16px;width:48px;height:26px;border-radius:13px;background:#2a3542;position:relative;cursor:pointer;transition:.2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a97a5;transition:.2s}
  .toggle.on{background:var(--on)}
  .toggle.on::after{left:25px;background:#fff}
  .card.on-device{box-shadow:0 0 0 1px var(--on) inset}
  .slider{width:100%;margin-top:14px;accent-color:var(--accent);cursor:pointer}
  .value{font-size:22px;font-weight:600;margin-top:8px}
  .value small{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
  .temp-row{display:flex;align-items:center;gap:14px;margin-top:12px}
  .temp-btn{width:34px;height:34px;border-radius:50%;border:1px solid #2a3542;background:var(--card2);color:var(--text);font-size:18px;cursor:pointer}
  .temp-btn:hover{border-color:var(--accent)}
  .chart{margin-top:14px;display:flex;align-items:flex-end;gap:4px;height:50px}
  .chart i{flex:1;background:var(--accent);opacity:.7;border-radius:3px 3px 0 0;min-height:4px}
  footer{margin-top:24px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header>
  <h1>🏠 <span>Smarthome</span> 智能家居控制面板</h1>
  <div class="status">● 网关在线 · 8 台设备已连接</div>
</header>

<div class="rooms" id="rooms"></div>
<div class="grid" id="grid"></div>

<footer>演示数据 · 所有设备状态仅保存在本地浏览器</footer>

<script>
const devices=[
  {id:1,room:"客厅",icon:"💡",name:"客厅主灯",type:"toggle",on:true},
  {id:2,room:"客厅",icon:"🌡️",name:"空调",type:"temp",on:true,temp:24},
  {id:3,room:"客厅",icon:"📺",name:"电视",type:"toggle",on:false},
  {id:4,room:"卧室",icon:"💡",name:"卧室灯带",type:"dim",on:true,bright:65},
  {id:5,room:"卧室",icon:"🌡️",name:"加湿器",type:"toggle",on:false},
  {id:6,room:"厨房",icon:"☕",name:"咖啡机",type:"toggle",on:false},
  {id:7,room:"全屋",icon:"🔒",name:"门锁与安防",type:"toggle",on:true},
  {id:8,room:"全屋",icon:"⚡",name:"今日用电",type:"chart",data:[12,8,15,20,18,30,42,38,25,16,22,28]}
];
const rooms=["全部","客厅","卧室","厨房","全屋"];
let curRoom="全部";
const saved=localStorage.getItem("smarthome-devices");
if(saved) Object.assign(devices,JSON.parse(saved));

function save(){localStorage.setItem("smarthome-devices",JSON.stringify(devices.map(({id,on,temp,bright})=>({id,on,temp,bright}))))}

function render(){
  document.getElementById("rooms").innerHTML=rooms.map(r=>
    `<button class="room-btn ${r===curRoom?'active':''}" onclick="setRoom('${r}')">${r}</button>`).join("");
  const list=devices.filter(d=>curRoom==="全部"||d.room===curRoom);
  document.getElementById("grid").innerHTML=list.map(d=>{
    const onCls=d.on?'on-device':'';
    if(d.type==="toggle")return card(d,`
      <div class="toggle ${d.on?'on':''}" onclick="flip(${d.id})"></div>`);
    if(d.type==="dim")return card(d,`
      <div class="value">${d.on?d.bright:0}<small>% 亮度</small></div>
      <input class="slider" type="range" min="0" max="100" value="${d.bright}"
        oninput="setBright(${d.id},this.value)">`);
    if(d.type==="temp")return card(d,`
      <div class="value">${d.temp}<small>°C</small></div>
      <div class="temp-row">
        <button class="temp-btn" onclick="setTemp(${d.id},-1)">−</button>
        <button class="temp-btn" onclick="setTemp(${d.id},1)">＋</button>
      </div>`);
    if(d.type==="chart")return card(d,`
      <div class="value">${d.data.reduce((a,b)=>a+b,0)/10}<small> kWh</small></div>
      <div class="chart">${d.data.map(v=>`<i style="height:${v/45*100}%"></i>`).join("")}</div>`);
    return "";
  }).join("");
  function card(d,inner){return `
    <div class="card ${onCls}">
      <div class="icon">${d.icon}</div>
      <h3>${d.name}</h3>
      <div class="desc">${d.room} · ${d.on?"运行中":"已关闭"}</div>
      ${inner}
    </div>`}
}
function setRoom(r){curRoom=r;render()}
function flip(id){const d=devices.find(x=>x.id===id);d.on=!d.on;save();render()}
function setBright(id,v){const d=devices.find(x=>x.id===id);d.bright=+v;d.on=+v>0;save();render()}
function setTemp(id,delta){const d=devices.find(x=>x.id===id);d.temp=Math.min(30,Math.max(16,d.temp+delta));save();render()}
render();
</script>
</body>
</html>
